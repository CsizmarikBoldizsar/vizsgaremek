<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            user-select: none;
        }
        body{
            margin: 0px;

        }
        .shop {

            box-sizing: content-box;

            display: flex;
            flex-direction: column;
            width: 100%;

            font-size: 18px;
            overflow-y: show;
            overflow-x: show;

            padding: 0px;
            padding-bottom: 18px;
            margin: 0px;

            font-weight: bold;
            
            border-top: 2px black solid;

        }

        #list{
            background-color: #7f708a;
        }



        .element {
            font-size: 1rem;

            display: flex;
            flex-direction: row;
            width: 100%;
            margin-left: 1rem;

            align-items: center;

            height: 1.5rem;
            padding: .2rem;

            font-weight: lighter;
            background-color:   #9babb2;

        }

        .element:nth-child(2n){
            background-color: #c7dcd0;
        }





        .closed .element {
            display: none;
        }

        .extra{
            color: #807269;
            font-size: 1rem;
        }


        .title{
            margin-left: .5rem;
            cursor:pointer;
            height: 3rem;
            display: flex;
            align-items: center;
        }

        .closed{
            padding: 0px;
        }

        .title::after{
            content: " ▾";
        }
        .closed .title::after{
            content: " ▸";
        }

        span:first-of-type{
            text-align: center;
            width: 2rem;
        }


        .delete{
            display: none;
            width: 1.5rem;
            height: 1.5rem;
            font-size: 1rem;
            text-align: center;
            background-color: red;
            border-radius: .2rem;
            margin-left: 2rem;

            
            cursor:pointer;
        }

        .bought *{
            text-decoration:line-through;
            color: #165a4c;
            display: block;
        }

        .bought .delete{
            text-decoration: none;
        }


        .new {
            display: flex;
            flex-direction: row;
            width: 100%;
        }
    </style>    
</head>
<body>
    <div class="new">
        <input type="number" id="newAmount" size="1" placeholder="amount" value="1">
        <input type="text" id="newProduct" size="8" placeholder="product" value="Alma">
        <input type="text" id="newExtra" size="10" placeholder="extra" value="granny smith">
        <input type="text" id="newShop" size="5" placeholder="shop" value="Spar">
        <button id="newBtn">Add</button>
    </div>

    <div id="list">
        
    </div>


</body>
<script>
    const lista = [
        {
            shop: "Aldi",
            products: [        
                {id: 0, product: "majonéz", extra: "fekete kupak", amount: 26},
                {id: 1, product: "ketchup", extra: "heinz", amount: 1},
                {id: 2, product: "majonéz", extra: "fekete kupak", amount: 26},
                {id: 3, product: "ketchup", extra: "heinz", amount: 1},
            ]
        },
        {
            shop: "Spar",
            products: [        
                {id: 4, product: "uborka", extra: "xxl", amount: 3},
                {id: 5, product: "uborka", extra: "xxl", amount: 3},
                {id: 6, product: "uborka", extra: "xxl", amount: 3},
            ]
        },

    ]

function  Draw() {
    list.innerHTML = ""

    lista.forEach(e=>{  
        const shop = document.createElement("ul")
        shop.classList = "shop"

        const title = document.createElement("div")
        title.classList = "title"
        title.appendChild(document.createTextNode(e.shop))

        shop.appendChild(title)

        e.products.forEach((t,i)=>{
            const element = document.createElement("li")
            element.classList = "element"
            element.id = t.id

            element.addEventListener("click", ()=>{
                element.classList.toggle("bought")
            })

            const amount = document.createElement("span")
            amount.classList = "amount"
            amount.appendChild(document.createTextNode(`${t.amount}`))
            element.appendChild(amount)
            

            const product = document.createElement("span")
            product.classList = "product"
            product.appendChild(document.createTextNode(` ${t.product}`))
            element.appendChild(product)
            
            const extra = document.createElement("span")
            extra.classList = "extra"
            extra.appendChild(document.createTextNode(` (${t.extra})`))
            element.appendChild(extra)
            
            const del = document.createElement("div")
            del.classList = "delete"
            del.appendChild(document.createTextNode(`🗑️`))
            element.appendChild(del)

            del.addEventListener("click",()=>{
                element.remove()

                e.products.forEach((x,i)=>{
                    if (x.id == Number(element.id)){
                        e.products.splice(i,1)
                    }
                })

                
                lista.forEach((x,i)=>{
                    if (x.products.length == 0){
                        lista.splice(i,1)
                        shop.remove()

                    }
                    console.log(x.products.length)
                })

            })

            shop.appendChild(element)
        })

        title.addEventListener("click", () => {
            shop.classList.toggle("closed")
        })


        list.appendChild(shop)
        
    })
}


Draw();



newBtn.onclick= () =>{
    console.log("wsefgeg")
    const obj = {id: Math.round(Math.random() * 100000), product: newProduct.value, extra: newExtra.value, amount: Number(newAmount.value)}

    let a = false;

    lista.forEach(x=>{
        if (newShop.value == x.shop){
            x.products.push(obj)
            a = true
            return
        }
    })
        

    if (a == false) {lista.push({shop: newShop.value, products: [obj]})}
    
    
    Draw()
}


</script>
</html>
